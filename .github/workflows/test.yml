name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node verify.mjs examples/agreed-verified.json
      - run: node verify.mjs examples/not-unanimous-failing.json

  action:
    # The action, run the way a workflow would run it, on this repository's
    # own examples. No comment is posted: the examples are not this change's
    # receipt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: one
        uses: ./
        with:
          path: examples/agreed-verified.json
          comment: "false"
          fail-on-grade: failed, unverified
      - id: both
        uses: ./
        with:
          path: examples
          comment: "false"
      - name: The outputs say what the examples are
        env:
          ONE_GRADE: ${{ steps.one.outputs.grade }}
          ONE_VALID: ${{ steps.one.outputs.valid }}
          BOTH_COUNT: ${{ steps.both.outputs.count }}
          BOTH_GRADES: ${{ steps.both.outputs.grades }}
        run: |
          test "$ONE_GRADE" = "verified"
          test "$ONE_VALID" = "true"
          test "$BOTH_COUNT" = "2"
          test "$BOTH_GRADES" = "verified,failed"
      - id: strict
        name: A failed grade fails the job when the workflow asks
        continue-on-error: true
        uses: ./
        with:
          path: examples/not-unanimous-failing.json
          comment: "false"
          fail-on-grade: failed
      - name: And it did fail
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = "failure"
      - name: Make a key and sign an example with it
        id: key
        run: |
          mkdir -p "$RUNNER_TEMP/keys" signed
          echo "public=$(node sign.mjs keygen "$RUNNER_TEMP/keys/signing-key.json")" >> "$GITHUB_OUTPUT"
          node sign.mjs sign --key "$RUNNER_TEMP/keys/signing-key.json" examples/agreed-verified.json > signed/receipt.json
      - id: signed
        name: A receipt signed by a listed key is accepted
        uses: ./
        with:
          path: signed
          comment: "false"
          require-signature: true
          trusted-keys: |
            ${{ steps.key.outputs.public }} This run's key
      - name: And it says so
        env:
          SIGNED: ${{ steps.signed.outputs.signed }}
        run: test "$SIGNED" = "true"
      - id: unsigned
        name: An unsigned receipt is refused when a signature is required
        continue-on-error: true
        uses: ./
        with:
          path: examples/agreed-verified.json
          comment: "false"
          require-signature: true
          trusted-keys: |
            ${{ steps.key.outputs.public }} This run's key
      - name: And it was refused
        env:
          OUTCOME: ${{ steps.unsigned.outcome }}
        run: test "$OUTCOME" = "failure"
